server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression (le modèle 3D .glb gagne encore ~30 %)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary font/otf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # index.html : toujours revalidé pour récupérer les nouveaux bundles après un déploiement
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bundles Angular : le nom contient un hash, on peut les cacher à vie
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Assets non hashés : cache court, revalidé ensuite
    location /assets/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        location ~* \.glb$ {
            types { }
            default_type model/gltf-binary;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
    }
}
