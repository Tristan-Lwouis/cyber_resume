<section class="svg-container" cdkDrag
  (cdkDragMoved)="onDragMoved($event)"
  (click)="onWindowClick()"
  appViewportLine
  [componentId]="componentId"
  [distancePercentage]="distancePercentage"
  [style.z-index]="windowZIndex">

  <!-- TAB SELECTOR AND HANDLE -->
  <div class="bandeau-onglet clickable">
    <div id="selectorTab1" (click)="showFirstTab()">
      <span>LO1SIRS</span>
    </div>
    <!-- Tab two -->
    <div id="selectorTab2" (click)="showSecondTab()">
      <span>SK1LLS</span>
    </div>
    <!-- Handle -->
    <div id="Handle" cdkDragHandle>
      <span>´</span>
    </div>
  </div>

  <!-- Boutons agrandir / fermer, encastrés au bout de la barre noire -->
  <app-window-controls (toggleSize)="expand.emit()" (close)="closeComponent.emit()"></app-window-controls>

  <!-- FIRST TAB LOISIRS -->
  <svg class="carte" [ngStyle]="{'z-index': skillsZIndex}" width="853" height="284"
    viewBox="0 0 853 284" fill="none" xmlns="http://www.w3.org/2000/svg">

    <!-- Motif rayé jaune / noir des barres de déplacement -->
    <defs>
      <pattern [attr.id]="stripesId" patternUnits="userSpaceOnUse" width="22" height="22" patternTransform="rotate(40)">
        <rect width="22" height="22" fill="var(--background-color)" />
        <rect width="22" height="11" fill="var(--primary-color)" />
      </pattern>
    </defs>
    <path d="M836 14.7576H301.001V48.7576H850V28.8L836 14.7576Z" [attr.fill]="'url(#' + stripesId + ')'" stroke="var(--background-color)" stroke-width="5" />
                                      <path d="M3 280.758V36.7637H211.5L225.5 2.75757H433.5L461 36.7637H850V253.258L822.5 280.758H3Z" fill="var(--primary-color)"
                                        stroke="black" stroke-width="5" />
                                      <!-- Baie des boutons agrandir / fermer : bord gauche droit, au bout de la barre (bord droit de la fenêtre) -->
                                      <path class="control-bay" d="M788 0.76H850L866.5 17.3V36.5H788Z" fill="var(--background-color)" />

                                        <!-- Intérieur de la carte -->
                                        <foreignObject x="30" y="40" width="830" height="240">
                                          <!--
                                          x : Décale le forein vers la droite
                                          y : Décale le forein vers le bas
                                          width : Largeur du forein
                                          height : Hauteur du forein
                                          -->
                                          <section xmlns="http://www.w3.org/1999/xhtml">
                                            <div id="SkillsCard">
                                              <!-- style="display:flex;flex-direction:column;gap:.5rem;overflow:hidden;" -->
                                              <!-- A49F26 Couleur a appliquer au numéros ! -->
                                              <p>
                                                @for (skill of skillsData; track skill) {
                                                  <span class="number">{{ skill.number }}</span> {{ skill.name }};<br>
                                                }
                                              </p>
                                              <img src="assets/media/icons/cyber_brain.png" alt="cyber brain image" style="margin : 2rem " />
                                            </div>
                                          </section>
                                        </foreignObject>
                                      </svg>

                                      <!-- SECOND TAB SKILLS -->
                                      <svg class="carte" [ngStyle]="{'z-index': loisirsZIndex}" width="853" height="284" viewBox="0 0 853 284"
                                        fill="none" xmlns="http://www.w3.org/2000/svg">

                                        <path d="M822.5 281H3V35V3H209.5L226.5 37.0061H850V253.5L822.5 281Z" fill="var(--primary-color)" stroke="black"
                                          stroke-width="5" />
                                        <!-- Baie des boutons agrandir / fermer : bord gauche droit, au bout de la barre (bord droit de la fenêtre) -->
                                        <path class="control-bay" d="M788 0.76H850L866.5 17.3V36.5H788Z" fill="var(--background-color)" />

                                          <!-- Intérieur de la carte -->
                                          <foreignObject id="test" x="8" y="40" width="100%" height="100%">
                                            <section id="Loisir">
                                              <!-- Premiere ligne de logo -->

                                              @for (loisir of loisirsData; track loisir) {
                                                <div class="LoisirIcon clickable" role="button" tabindex="0" (click)="onClickAnimationArray(loisir.animations)">
                                                  <img [src]="loisir.imagePath" alt="">
                                                  <p>{{ loisir.name }}</p>
                                                </div>
                                              }
                                            </section>
                                            <!-- Section avec le Qr code de déco -->
                                            <div id="QrDeco">
                                              <img src="assets/media/icons/QR-Icon.png" alt="">
                                            </div>
                                          </foreignObject>

                                        </svg>

                                      </section>
