<section class="svg-container" cdkDrag 
         (cdkDragMoved)="onDragMoved($event)"
         (click)="onWindowClick()"
         appViewportLine 
         [componentId]="componentId"
         [distancePercentage]="distancePercentage"
         [style.z-index]="windowZIndex">
    
    <div id="onglet" >
        <span>{{ tabTitle }}</span>
    </div >
    <!-- Boutons agrandir / fermer, encastrés au bout de la barre noire -->
    <app-window-controls (toggleSize)="expand.emit()" (close)="onCloseClick()"></app-window-controls>
    <!-- Handle -->
    <div id="Handle" class="clickable" cdkDragHandle>
    </div>
    <!-- <svg id="svgHandle" width="329" height="46" viewBox="0 0 329 46" fill="none" xmlns="http://www.w3.org/2000/svg"  >
        <path d="M310.719 3H3V43.3765H326V15.0605L310.719 3Z" fill="black" stroke="black" stroke-width="5"/>
    </svg> -->
    <svg id="svg" width="100%" height="100%" viewBox="0 0 600 693" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M584 16.4587H253V56.8352H597V29.5L584 16.4587Z" fill="var(--background-color)" stroke="var(--background-color)" stroke-width="5"/>
        <path d="M3 690V3H248.5L306 36.0275H597V690H3Z" fill="var(--primary-color)" stroke="var(--background-color)" stroke-width="5"/>
        <!-- Baie des boutons agrandir / fermer (au bout de la barre, bord droit de la fenêtre) -->
        <path class="control-bay" d="M524 16.46H584L599.5 32V58H514Z" fill="var(--background-color)" />
        <path class="control-bay" d="M517 16.46H521.5L511.5 58H507Z" fill="var(--primary-color)" />
        
        <foreignObject x="20" y="60" width="94%" height="88%">
            <div class="text-container scrollable" [innerHTML]="content">
            </div>
        </foreignObject>
    </svg>        
</section>
