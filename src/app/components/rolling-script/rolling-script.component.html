<div class="terminal-frame" [ngStyle]="{ width: width, height: height }">
  <!-- Header du terminal -->
  <div class="terminal-header">
    <div class="header-led"></div>
    <span class="header-title">CYBER_RESUME [ONLINE]</span>
  </div>

  <div class="terminal-content">
    <div #codeContainer class="code-display">
      @for (line of lines; track $index; let last = $last) {
        <pre [class.last-line]="last">{{ line }}</pre>
      }
    </div>

    <!-- Overlays d'effets visuels -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="glitch-overlay"></div>
  </div>
</div>
