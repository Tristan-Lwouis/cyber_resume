<div class="map-inner-container">
  <div #mapElement class="map-container"></div>

  <!-- Légende / Infos tactiques -->
  <div class="map-legend">
    <div class="legend-header">RAYON_DE_DÉPLACEMENT</div>
    <div class="legend-body">
      <div class="legend-item">
        <span class="label">RANGE:</span>
        <span class="value">30.00 KM</span>
      </div>
      <div class="legend-item">
        <span class="label">STATUS:</span>
        <span class="value status-active">OPERATIONAL</span>
      </div>
      <div class="legend-item">
        <span class="label">DISTRICT:</span>
        <span class="value">TOULOUSE</span>
      </div>
    </div>
    <div class="legend-timer">PERMIS B : OK</div>
  </div>

  <!-- Modes de travail acceptés -->
  <div class="map-legend map-legend--remote">
    <div class="legend-header">MODE_DE_TRAVAIL</div>
    <div class="legend-body">
      <div class="legend-item">
        <span class="label">SUR SITE:</span>
        <span class="value">&lt; 30 KM</span>
      </div>
      <div class="legend-item">
        <span class="label">HYBRIDE:</span>
        <span class="value status-active">OK</span>
      </div>
      <div class="legend-item">
        <span class="label">FULL REMOTE:</span>
        <span class="value status-active">OK</span>
      </div>
    </div>
    <div class="legend-timer">TÉLÉTRAVAIL : OK</div>
  </div>

  <!-- Overlays d'effets visuels -->
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="glitch-overlay"></div>
</div>
