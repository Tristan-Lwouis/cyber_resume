<section class="svg-container" cdkDrag
  (cdkDragMoved)="onDragMoved($event)"
  (click)="onWindowClick()"
  appViewportLine
  componentId="competances"
  lineColor="black"
  [distancePercentage]="distancePercentage"
  [style.z-index]="windowZIndex">

  <!-- TAB SELECTOR AND HANDLE -->
  <div class="bandeau-onglet clickable">
    <div id="selectorTab1" [class.inactive-tab]="activeTab !== 'dev'" (click)="setTab('dev')">
      <span>C0MP3TENCES</span>
    </div>
    <div id="selectorTab2" [class.inactive-tab]="activeTab !== 'tools'" (click)="setTab('tools')">
      <span>L0G1CIELS</span>
    </div>
    <div id="Handle" cdkDragHandle>
      <span></span>
    </div>
  </div>

  <!-- Boutons agrandir / fermer, encastrés au bout de la barre noire -->
  <app-window-controls (toggleSize)="expand.emit()" (close)="onCloseClick()"></app-window-controls>

    <path class="control-bay" d="M517 16.5H521.5L511.5 52H507Z" fill="var(--primary-color)" />
